<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Erscheint – Display</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: 'Segoe UI', 'Arial Black', Arial, sans-serif;
      font-weight: 600;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    #lyrics-container {
      width: 96vw;
      max-height: 96vh;
      text-align: left;
      overflow: hidden;
      line-height: 1.5;
      column-gap: 4vw;
      /* white-space and display are set dynamically by display.js */
    }

    .song-title {
      display: block;
      font-weight: 800;
      letter-spacing: 0.03em;
      margin-bottom: 0.1em;
    }

    .song-artist {
      display: block;
      font-size: 0.6em;
      font-weight: 400;
      opacity: 0.55;
      letter-spacing: 0.01em;
      margin-bottom: 0.55em;
    }

    .section {
      break-inside: avoid;
      display: block;
    }

    .section + .section { margin-top: 1.1em; }

    .section-label {
      display: block;
      font-weight: 800;
      font-size: 0.82em;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.15em;
      color: rgba(255,255,255,.4);
    }

    /* Section type colours */
    .sec-verse  .section-label { color: #86efac; }
    .sec-chorus .section-label { color: #fbbf24; }
    .sec-bridge .section-label { color: #f472b6; }
    .sec-intro  .section-label { color: #67e8f9; }
    .sec-outro  .section-label { color: #94a3b8; }
    .sec-pre    .section-label { color: #a78bfa; }

    /* Section type text colours + indentation */
    .sec-verse .lyric-line,
    .sec-verse .lyric-text  { color: #bbf7d0; opacity: 1; }

    .sec-chorus { padding-left: 1.1em; }
    .sec-chorus .lyric-line,
    .sec-chorus .lyric-text  { color: #fde68a; opacity: 1; }

    .sec-bridge .lyric-line,
    .sec-bridge .lyric-text  { color: #fbcfe8; opacity: 1; }

    .sec-pre .lyric-line,
    .sec-pre .lyric-text     { color: #ddd6fe; opacity: 1; }

    .lyric-line {
      display: block;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-shadow: 0 0 24px rgba(255,255,255,.18);
    }

/* ── Chord display ───────────────────────────────────────────────────────── */
.chord-group {
  display: inline-flex; flex-direction: column;
  align-items: flex-start; vertical-align: bottom;
}
.chord {
  font-size: 0.9em; font-weight: 800;
  color: #fff; line-height: 1.2;
  white-space: pre; letter-spacing: 0.01em;
}
.lyric-text { white-space: pre; font-size: 0.88em; opacity: 0.82; line-height: 1.35; }

.meta-overlay {
  position: fixed; bottom: 14px; right: 14px; z-index: 10;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);
  border-radius: 8px; padding: 6px 12px;
  font-size: 12px; color: rgba(255,255,255,.55);
  display: flex; align-items: center; gap: 8px;
  transition: background .15s;
}
.meta-overlay:hover { background: rgba(255,255,255,.14); }
.meta-btn {
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2);
  border-radius: 5px; color: rgba(255,255,255,.8);
  font-size: 14px; cursor: pointer;
  padding: 6px 14px; line-height: 1;
  touch-action: manipulation;
  transition: background .1s, color .1s;
  -webkit-tap-highlight-color: transparent;
}
.meta-btn:hover, .meta-btn:active { background: rgba(255,255,255,.25); color: #fff; }

/* ── Song sidebar ────────────────────────────────────────────────────────── */
#sidebar-toggle {
  display: none; /* shown via JS on /chords only */
  position: fixed; top: 14px; left: 14px; z-index: 30;
  width: 44px; height: 44px; border-radius: 10px;
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2);
  color: #fff; font-size: 20px; cursor: pointer;
  align-items: center; justify-content: center;
  transition: background .15s;
  -webkit-tap-highlight-color: transparent;
}
#sidebar-toggle:hover { background: rgba(255,255,255,.22); }

#sidebar-overlay {
  display: none; position: fixed; inset: 0; z-index: 40;
  background: rgba(0,0,0,.55); backdrop-filter: blur(3px);
}
#sidebar-overlay.open { display: block; }

#song-sidebar {
  position: fixed; top: 0; left: 0; bottom: 0; z-index: 50;
  width: 300px;
  background: #0a0a12; border-right: 1px solid rgba(255,255,255,.12);
  display: flex; flex-direction: column;
  transform: translateX(-100%);
  transition: transform .25s cubic-bezier(.4,0,.2,1);
}
#song-sidebar.open { transform: translateX(0); }

.sidebar-header {
  display: flex; align-items: center; gap: 10px;
  padding: 16px 14px 12px;
  border-bottom: 1px solid rgba(255,255,255,.1);
  flex-shrink: 0;
}
.sidebar-header span {
  flex: 1; font-size: 13px; font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase;
  color: rgba(255,255,255,.45);
}
#sidebar-close {
  background: none; border: none; color: rgba(255,255,255,.5);
  font-size: 20px; cursor: pointer; padding: 2px 4px; line-height: 1;
  border-radius: 6px; transition: color .1s;
}
#sidebar-close:hover { color: #fff; }

#sidebar-arr-select {
  margin: 10px 12px 0; flex-shrink: 0;
  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14);
  border-radius: 8px; padding: 9px 12px;
  color: #fff; font-size: 13px; outline: none;
  font-family: inherit; cursor: pointer;
  appearance: none; -webkit-appearance: none;
}
#sidebar-arr-select:focus { border-color: rgba(255,255,255,.3); }
#sidebar-arr-select option { background: #141420; color: #fff; }

#sidebar-search {
  margin: 8px 12px; flex-shrink: 0;
  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14);
  border-radius: 8px; padding: 9px 12px;
  color: #fff; font-size: 14px; outline: none;
  font-family: inherit;
}
#sidebar-search::placeholder { color: rgba(255,255,255,.3); }
#sidebar-search:focus { border-color: rgba(255,255,255,.3); }

#sidebar-list {
  flex: 1; overflow-y: auto; list-style: none;
  padding: 4px 8px 16px;
}
#sidebar-list::-webkit-scrollbar { width: 4px; }
#sidebar-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 2px; }

.sidebar-song {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 10px; border-radius: 8px;
  cursor: pointer; gap: 8px;
  transition: background .1s;
  -webkit-tap-highlight-color: transparent;
}
.sidebar-song:hover  { background: rgba(255,255,255,.09); }
.sidebar-song.active { background: rgba(255,255,255,.13); }
.sidebar-song-num    { width: 20px; font-size: 11px; font-weight: 700; color: rgba(255,255,255,.3);
                       flex-shrink: 0; text-align: right; }
.sidebar-song-title  { flex: 1; font-size: 14px; font-weight: 600; color: #fff; }
.sidebar-song-key    { font-size: 11px; font-weight: 700; color: rgba(255,255,255,.4);
                       background: rgba(255,255,255,.08); padding: 2px 7px; border-radius: 4px; flex-shrink: 0; }
.sidebar-empty       { padding: 20px 10px; font-size: 13px; color: rgba(255,255,255,.3); text-align: center; }

  </style>
</head>
<body>
  <button id="sidebar-toggle" title="Songs">☰</button>

  <div id="sidebar-overlay"></div>
  <div id="song-sidebar">
    <div class="sidebar-header">
      <span>Songs</span>
      <button id="sidebar-close" title="Schließen">✕</button>
    </div>
    <select id="sidebar-arr-select"></select>
    <input id="sidebar-search" type="search" placeholder="Alle Songs durchsuchen …" autocomplete="off">
    <ul id="sidebar-list"></ul>
  </div>

  <div id="lyrics-container"></div>

  <div class="meta-overlay" id="meta-overlay" style="display:none">
    <button class="meta-btn" id="meta-key-down">◀</button>
    <span id="meta-key-display" style="min-width:2em;text-align:center;font-weight:700"></span>
    <button class="meta-btn" id="meta-key-up">▶</button>
    <span id="meta-key-orig" style="opacity:.5;font-size:11px"></span>
    <span id="meta-capo-text" style="opacity:.6"></span>
  </div>

  <script src="display.js"></script>
</body>
</html>
