<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Erscheint – Display</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #lyrics-container {
      width: 90vw;
      max-height: 90vh;
      text-align: center;
      overflow: hidden;
      line-height: 1.4;
      column-gap: 4vw;
      /* white-space is set dynamically by display.js based on orientation */
    }

    .section {
      break-inside: avoid;
      display: block;
    }

    .section + .section {
      margin-top: 0.5em;
    }

    .song-title {
      display: block;
      opacity: 0.6;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.5em;
    }

    .section-label {
      display: block;
      opacity: 0.4;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.1em;
    }

    .lyric-line {
      display: block;
    }
  </style>
</head>
<body>
  <div id="lyrics-container"></div>
  <script src="display.js"></script>
</body>
</html>
